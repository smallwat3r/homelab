# Shared by nas and gardener. OMV's overlay writecaches under /run and
# docker's overlay mounts would each become four sensors in Home Assistant,
# hide them
[fs]
hide=/run/omv-writecache.*,/var/lib/docker.*,/boot.*

# Loop devices, zram, docker bridges and veth pairs are noise in HA
[diskio]
hide=loop.*,zram.*,ram.*

[network]
hide=lo,veth.*,br-.*,docker0
