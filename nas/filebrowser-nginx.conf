# Serve File Browser at /files on OMV's own nginx instead of its bare port,
# its baseURL is patched to match by filebrowser-baseurl.conf
location = /files { return 301 /files/; }
location /files/ {
    proxy_pass http://127.0.0.1:@PORT@;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # uploads stream straight through, no size cap and no buffering to disk
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
}
