# Serve Forgejo at /git on OMV's own nginx. It serves at the root of its own
# port, the trailing slash on proxy_pass strips the prefix, its ROOT_URL puts
# it back on every link it renders
location = /git { return 301 /git/; }
location /git/ {
    proxy_pass http://127.0.0.1:@PORT@/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # pushes and large clones stream straight through
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
}
