# The exit node goes out through IVPN. Forwarded traffic arriving on
# tailscale0 looks up table 200, where wg-quick puts the tunnel's default
# route (Table = 200, added to the config by make ivpn-conf). LAN
# destinations throw back to the main table, and the unreachable default
# with the worse metric (IPv6 routes get 1024 when none is given) takes
# over if the tunnel drops on its own, so nothing leaks out through eth0.
# A deliberate ivpn-ctl stop removes the rule instead, sending exit traffic
# straight out. ha's own traffic, tailscaled included, never looks at
# table 200 and stays direct. Ordered before tailscaled so the rules exist
# before any exit node traffic can arrive.
[Unit]
Before=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'ip rule show pref 5100 | grep -q . || ip rule add pref 5100 iif tailscale0 lookup 200'
ExecStartPre=/bin/sh -c 'ip -6 rule show pref 5100 | grep -q . || ip -6 rule add pref 5100 iif tailscale0 lookup 200'
ExecStartPre=/usr/sbin/ip route replace throw @LAN_SUBNET@ table 200
ExecStartPre=/usr/sbin/ip route replace unreachable default table 200 metric 2000
ExecStartPre=/usr/sbin/ip -6 route replace unreachable default table 200 metric 2000
