default_config:

homeassistant:
  external_url: https://ha.ts.smallwat3r.com

# themes/ holds the repo's Terminal theme, picked per user in the profile.
# www/ is served at /local, the module loads the ocrab font for the theme.
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /local/ocrab.js

recorder:
  purge_keep_days: 3
  commit_interval: 30

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

lovelace:
  dashboards:
    dashboard-network:
      mode: yaml
      title: Network
      icon: mdi:router-wireless
      filename: dashboards/network.yaml
