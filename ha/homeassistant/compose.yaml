services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - /opt/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # bind the parent, not the autofs trigger, so a down NAS cannot block container
      # creation, rslave makes the share appear under /media/NAS/stuff once it mounts
      - type: bind
        source: /mnt/nas
        target: /media/NAS
        bind:
          propagation: rslave
    restart: unless-stopped
    privileged: true
    network_mode: host
    cpus: "3"
