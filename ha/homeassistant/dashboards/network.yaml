title: Network
views:
  - title: Network
    path: network
    cards:
      - type: entities
        title: capowifi
        entities:
          - sensor.capowifi_status
          - sensor.capowifi_connected_clients
          - sensor.capowifi_connected_guest_clients
          - sensor.capowifi_public_ip
          - switch.capowifi_guest_network
          - switch.capowifi_ad_blocking
          - update.living_room_living_room_capowifi_living_room_firmware
      - type: entities
        title: Speed test
        entities:
          - sensor.capowifi_download_speed
          - sensor.capowifi_upload_speed
          - button.capowifi_run_speed_test
      - type: entities
        title: Profiles
        entities:
          - switch.unassigned_capowifi_unassigned_paused
          - sensor.unassigned_capowifi_unassigned_connected_clients
      # every eero client, the profile trackers have no mac so they drop out
      - type: markdown
        title: Devices
        content: |
          | | Device | IP | Link |
          |---|---|---|---|
          {% for s in states.device_tracker | selectattr('attributes.mac', 'defined') | sort(attribute='name') | sort(attribute='state') -%}
          | <ha-icon icon="mdi:{{ 'lan-connect' if s.state == 'home' else 'lan-disconnect' }}"></ha-icon> | {{ s.attributes.get('host_name') or s.name }} | {{ s.attributes.get('ip', '') }} | {{ s.attributes.get('connection_type', '') }} |
          {% endfor %}
      - type: entities
        title: HA
        entities:
          - entity: sensor.system_monitor_uptime
            name: Uptime
          - entity: sensor.system_monitor_processor_use
            name: CPU
          - entity: sensor.system_monitor_processor_temperature
            name: CPU temperature
          - entity: sensor.system_monitor_load_1_min
            name: Load 1 min
          - entity: sensor.system_monitor_load_5_min
            name: Load 5 min
          - entity: sensor.system_monitor_load_15_min
            name: Load 15 min
          - entity: sensor.system_monitor_memory_usage
            name: Memory
          - entity: sensor.system_monitor_memory_free
            name: Memory free
          - entity: sensor.system_monitor_swap_usage
            name: Swap
          - entity: sensor.system_monitor_disk_usage
            name: SD card
          - entity: sensor.system_monitor_disk_free
            name: SD card free
          - entity: sensor.system_monitor_network_throughput_in_eth0
            name: Network in
          - entity: sensor.system_monitor_network_throughput_out_eth0
            name: Network out
      - type: entities
        title: NAS
        entities:
          - entity: sensor.nas_uptime
            name: Uptime
          - entity: sensor.nas_cpu_usage
            name: CPU
          - entity: sensor.nas_cpu_load
            name: Load
          - entity: sensor.nas_cpu_thermal_0_temperature
            name: CPU temperature
          - entity: sensor.nas_memory_usage
            name: Memory
          - entity: sensor.nas_disk_usage
            name: SD card
          - entity: sensor.nas_srv_dev_disk_by_uuid_7458469d_2afa_4b57_b708_a9c015f7fddb_disk_usage
            name: Data disk
          - entity: sensor.nas_srv_dev_disk_by_uuid_7458469d_2afa_4b57_b708_a9c015f7fddb_disk_free
            name: Data disk free
          - entity: sensor.nas_sda_disk_read
            name: Data disk read
          - entity: sensor.nas_sda_disk_write
            name: Data disk write
      - type: entities
        title: Gardener
        entities:
          - entity: sensor.gardener_uptime
            name: Uptime
          - entity: sensor.gardener_cpu_usage
            name: CPU
          - entity: sensor.gardener_cpu_load
            name: Load
          - entity: sensor.gardener_cpu_thermal_0_temperature
            name: CPU temperature
          - entity: sensor.gardener_memory_usage
            name: Memory
          - entity: sensor.gardener_disk_usage
            name: SD card
          - entity: sensor.gardener_containers_active
            name: Containers running
          - entity: sensor.gardener_containers_cpu_usage
            name: Containers CPU
          - entity: sensor.gardener_containers_memory_used
            name: Containers memory
  # Flexible Octopus on a non-smart meter, so rates only, the integration
  # disables its consumption sensors without half-hourly reads
  - title: Energy
    path: energy
    cards:
      - type: entities
        title: Octopus Energy
        entities:
          - entity: sensor.octopus_energy_electricity_d00a_32408_1200028140100_current_rate
            name: Unit rate
          - entity: sensor.octopus_energy_electricity_d00a_32408_1200028140100_current_standing_charge
            name: Standing charge
          - entity: sensor.octopus_energy_a_300dff0f_wheel_of_fortune_spins_electricity
            name: Wheel of fortune spins, electricity
          - entity: sensor.octopus_energy_a_300dff0f_wheel_of_fortune_spins_gas
            name: Wheel of fortune spins, gas
      - type: calendar
        title: Octoplus power downs
        initial_view: listWeek
        entities:
          - calendar.octopus_energy_a_300dff0f_octoplus_power_down
  - title: NAS
    path: nas
    cards:
      - type: button
        name: Open files
        icon: mdi:folder-open
        tap_action:
          action: url
          url_path: https://nas.ts.smallwat3r.com/files
  - title: Gardener
    path: gardener
    cards:
      - type: button
        name: Open gardener
        icon: mdi:sprout
        tap_action:
          action: url
          url_path: https://gardener.feist-corn.ts.net
