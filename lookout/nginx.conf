# The watchdog's page over the tailnet with the wildcard certificate, HTTPS
# only. The state directory is the web root, its other files only say up
# or down
server {
    listen 443 ssl;
    server_name lookout.@DOMAIN@;
    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    root /var/lib/watchdog;
    # a line per minute from every open tab is not worth SD card writes
    access_log off;
}
